upstream notes_api_node {
    server notes-api-node;
    keepalive 32;
}

server {
    listen 80;
    server_name grigoryvolchok.ru;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name grigoryvolchok.ru;

    ssl_certificate /etc/letsencrypt/live/grigoryvolchok.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grigoryvolchok.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ^~ /api/ {
        set $deny 0;
        if ($http_authorization = "") {
            set $deny 1;
        }
        if ($http_sec_fetch_mode = "navigate") {
            set $deny 1;
        }
        if ($http_accept ~* "text/plain") {
            set $deny 1;
        }
        if ($deny = 1) {
            return 403;
        }

        proxy_pass http://notes_api_node/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60;
        proxy_send_timeout 60;
        proxy_read_timeout 60;
        proxy_buffers 8 32k;
        proxy_buffer_size 64k;
    }
}
