services:
  nginx:
    ports:
      - "443:443"
    volumes:
      - ./configs/nginx.server.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro

  certbot:
    image: certbot/certbot:latest
    ports:
      - "80:80"
    volumes:
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: certbot
    profiles:
      - certbot

  notes-api-node:
    command: "node app.js"
